<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101415">
  <meta name="description" content="黒雨の城下町に現れる6体の敵。立体モデルと動き、出現場所、戦い方を紹介。">
  <title>六つの異影 — 黒雨の城下町</title>
  <link rel="stylesheet" href="/src/ui/characters.css">
</head>
<body>
  <header><a class="back" href="./">← 城下町へ戻る</a><span>黒雨の城下町 ／ 人物・妖異録</span><a href="./model-credits.html">モデルの出典 ↗</a></header>
  <main>
    <div class="intro"><p class="eyebrow">THE SIX SHADOWS</p><h1>六つの異影</h1><p>黒雨の夜、城下町で待ち受ける者たち。</p></div>
    <section class="showcase" aria-label="選択したキャラクター">
      <div class="stage"><canvas id="portrait" aria-label="キャラクターの3Dプレビュー"></canvas><span class="stage-caption">ドラッグで回転 · ピンチで拡大</span><p id="load-status" role="status" aria-live="polite">姿を呼び出しています…</p></div>
      <div class="profile"><p id="role" class="eyebrow"></p><h2 id="name"></h2><p id="original" class="original"></p><p id="description" class="description"></p><dl><dt>出現する場所</dt><dd id="location"></dd><dt>戦い方</dt><dd id="motion-note"></dd></dl><div class="motions" aria-label="動きを見る"><button data-motion="idle">待機</button><button data-motion="walk">移動</button><button data-motion="attack0">攻撃</button></div><a class="play" href="./">城下町で出会う →</a></div>
    </section>
    <section class="roster" aria-label="6体のキャラクター" id="cards"></section>
    <footer>それぞれの役割に合わせて、城下町から廃神社へ順に登場します。<br>キャラクターを選ぶと、姿と動きを確認できます。</footer>
  </main>
  <script type="module" src="/src/ui/CharacterGuide.js"></script>
</body>
</html>
