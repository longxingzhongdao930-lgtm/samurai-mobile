<text x="789" y="930" class="name">START</text>
<rect x="45" y="155" width="550" height="100" rx="8" fill="#202830" stroke="#b5907d"/>
<text x="63" y="185" class="name">⑥ 屋敷・城郭の領域</text>
<text x="63" y="212" class="body">長い塀と高麗門。店の看板は置かない。</text>
<text x="63" y="236" class="body">古竜の広場は中央を空ける。</text>
<path d="M 605 205 L 660 205 L 690 230.0 L 717 230.0" fill="none" stroke="#b5907d" stroke-width="1.5" opacity=".7"/>
<rect x="45" y="275" width="550" height="100" rx="8" fill="#202830" stroke="#7da18d"/>
<text x="63" y="305" class="name">⑤ 参道と境内</text>
<text x="63" y="332" class="body">常夜灯は入口、地蔵は路傍の小さな場所へ。</text>
<text x="63" y="356" class="body">石仏を街中へ無作為に散らさない。</text>
<path d="M 605 325 L 660 325 L 690 382.5 L 717 382.5" fill="none" stroke="#7da18d" stroke-width="1.5" opacity=".7"/>
<rect x="45" y="395" width="550" height="100" rx="8" fill="#202830" stroke="#c7b071"/>
<text x="63" y="425" class="name">④ 門前の広場</text>
<text x="63" y="452" class="body">端に掛茶屋と縁台。明かりで分岐を示す。</text>
<text x="63" y="476" class="body">中央は飛剣やレーザーを避ける空間。</text>
<path d="M 605 445 L 660 445 L 690 562.5 L 717 562.5" fill="none" stroke="#c7b071" stroke-width="1.5" opacity=".7"/>
<rect x="45" y="515" width="550" height="100" rx="8" fill="#202830" stroke="#bca16e"/>
<text x="63" y="545" class="name">③ 火除地を思わせる広場</text>
<text x="63" y="572" class="body">火の見櫓と番屋を外周へ。屋台は入口脇。</text>
<text x="63" y="596" class="body">広場を荷物や店で埋めない。</text>
<path d="M 605 565 L 660 565 L 690 637.5 L 717 637.5" fill="none" stroke="#bca16e" stroke-width="1.5" opacity=".7"/>
<rect x="45" y="635" width="550" height="100" rx="8" fill="#202830" stroke="#92a9a9"/>
<text x="63" y="665" class="name">② 裏長屋・店裏の荷捌き場</text>
<text x="63" y="692" class="body">左は共同井戸と生活道具、右は蔵と荷車。</text>
<text x="63" y="716" class="body">農家を裏長屋の代わりに並べない。</text>
<path d="M 605 685 L 660 685 L 690 737.5 L 717 737.5" fill="none" stroke="#92a9a9" stroke-width="1.5" opacity=".7"/>
<rect x="45" y="755" width="550" height="100" rx="8" fill="#202830" stroke="#c5ae8d"/>
<text x="63" y="785" class="name">① 酒屋・呉服屋の表通り</text>
<text x="63" y="812" class="body">軒下に樽や提灯、中央は幅9.2mを確保。</text>
<text x="63" y="836" class="body">土の道を主体に、石や灯りは要所だけ。</text>
<path d="M 605 805 L 660 805 L 690 835.0 L 717 835.0" fill="none" stroke="#c5ae8d" stroke-width="1.5" opacity=".7"/>
<text x="45" y="942" class="sub">既存の通行範囲を活用。配置時はモデルの幅・扉の開閉・カメラとの衝突を確認。</text>
<text x="45" y="973" class="tiny">添付素材のローカル変換・配置見本を作成済み。公開配信の利用条件は確認が必要。</text>
<text x="45" y="1000" class="tiny">参照：Stage.js / 添付OBJ・PP2とREADME。外部資料本文は接続制限により未取得。</text>
