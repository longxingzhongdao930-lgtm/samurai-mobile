<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>侍 SAMURAI — 一ノ章</title>
    <meta name="description" content="鬼武将 羅刹を討つ、和風剣戟アクション。PC・スマホ対応。" />
    <meta name="theme-color" content="#0b0808" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="侍" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <!-- No `<link rel="preload">` for the models: three's FileLoader fetches
         them with a credentials mode an `as="fetch"` preload does not match,
         so Chrome would download each twice. -->
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <h1 class="loader__title">侍</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">読み込み中…</p>
      </div>
    </div>

    <!-- The window's keys. The character's own moves are the panels along the
         bottom centre, drawn from `src/config/abilities.js`. -->
    <p class="hint">
      クリックで視点 · 左クリック 攻撃 · 右クリック ガード · B 飛燕 · Z 吸魂 · U 強化 · ホイール ズーム · Tab 装備<span class="hint__dev"> · G エディタ · F 統計</span> · P 一時停止
    </p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
