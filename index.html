<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="黒雨の城下町 — スマホで遊べる和風ダークファンタジー3Dアクションの体験版。" />
    <title>黒雨の城下町 — 体験版</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121820'/%3E%3Ccircle cx='16' cy='11' r='4' fill='%237fd4ff'/%3E%3Cpath d='M8 28c0-5 3.6-9 8-9s8 4 8 9z' fill='%237fd4ff'/%3E%3C/svg%3E"
    />
    <!-- No `<link rel="preload">` for the FBX: three's FileLoader fetches it
         over a plain XHR, whose credentials mode matches neither the
         crossorigin nor the bare form of an `as="fetch"` preload — Chrome
         refuses the match and downloads the 1.4 MB file a second time. -->
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <h1 class="loader__title">黒雨の城下町</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">読み込み中…</p>
      </div>
    </div>

    <!-- The window's keys. The character's own moves are the panels along the
         bottom centre, drawn from `src/config/abilities.js`. -->
    <p class="hint">
      Drag to orbit · wheel to zoom · Tab character screen · G editor · F stats · P pause
    </p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
