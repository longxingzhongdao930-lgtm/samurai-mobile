<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黒雨・モーション確認ボット</title><style>body{margin:0;background:#111922;color:#e5eaf0;font:15px sans-serif}main{display:grid;grid-template-columns:minmax(280px,340px) 1fr;height:100vh}aside{padding:20px;overflow:auto}a{color:#a5d6ff}label{display:block;margin:14px 0}select,input,button,textarea{box-sizing:border-box;width:100%;padding:8px;background:#24313f;color:white;border:1px solid #516273;border-radius:4px}button{cursor:pointer;margin:5px 0}canvas{width:100%;height:100%;display:block}textarea{height:110px}small{color:#aab9c8;line-height:1.5}#status{line-height:1.5}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:auto 60vh;height:auto}}</style></head><body><main><aside><a href="./">← 城下町</a><h1>モーション確認ボット</h1><label>キャラクター<select id="model"><option value="./models/tpose.fbx">主人公の骨格</option><option value="./models/characters/samurai.glb">黒雨の浪人</option><option value="./models/characters/queen.glb">剣の女王</option><option value="./models/characters/mage.glb">影の魔術師</option><option value="./models/reference/vergil.glb">バージル（モーション検証）</option><option value="./models/reference/force-edge.glb">Force Edge（幻影剣素材）</option><option value="./models/reference/judgement-cut-end.glb">次元斬・絶（静止エフェクト素材）</option></select></label><label>手元のGLB<input id="local-model" type="file" accept=".glb"></label><label>モーション<select id="motion"></select></label><label><input id="bones" type="checkbox" checked style="width:auto"> 骨格を表示</label><button id="play">一時停止</button><label>再生位置<input id="time" type="range" min="0" max="1" value="0" step=".001"></label><label>速度<input id="speed" type="range" min=".1" max="2" value="1" step=".05"></label><label>腰の高さ補正（モデル単位）<input id="height" type="number" value="0" step=".01"></label><label>胸の傾き補正（度）<input id="chest" type="number" value="0" step="1"></label><label>ボーン対応・軸補正JSON<textarea id="mapping">{"boneMap":{},"rotationOffsets":{}}</textarea></label><button id="apply">補正を適用</button><button id="save">補正済みモーションを保存</button><button id="save-library">元骨格・全モーションを一括保存</button><label>保存したモーションを読み込む<input id="local-motion" type="file" accept=".json"></label><p id="asset-notice"></p><a href="./licenses/reference-models.json" target="_blank" rel="noopener">追加素材の作者・出典・利用条件</a><p id="status" role="status">読み込み中…</p><small>人型の対応表で移植します。足の接地・手と武器の接触は体格に合わせた再調整が必要です。竜など異なる骨格に同じ技をそのまま適用はできません。ドラッグで回転、ホイールで拡大。</small></aside><canvas id="bot"></canvas></main><script type="module" src="/src/ui/MotionBot.js"></script></body></html>
